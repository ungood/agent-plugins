[settings]
lockfile = true

[tools]
hk = "2.10.0"
rumdl = "0.3.2"
jactionlint = "2.4.0"
node = "24"
uv = "0.13"
"npm:prettier" = "3.9.10"
"pipx:check-jsonschema" = "0.39.0"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install the tools this repo needs"
run = "mise install"

[tasks.check]
description = "Run every check without changing any files"
run = "hk check --all"

[tasks.fix]
description = "Apply safe fixes"
run = "hk fix --all"

[tasks.test]
description = "Run the tests"
run = "echo 'no tests yet'"

[tasks.ci]
description = "Run everything CI runs"
depends = ["check", "test"]
